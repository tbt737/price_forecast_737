commodity_code: "NSH_VN"
commodity_name: "Nhôm Sông Hồng (NSH)"
commodity_group: "equity"
base_unit: "share"
default_currency: "VND"

market_instruments:
  - { instrument_code: "HNX_NSH", exchange: "HNX (Hanoi Stock Exchange)", symbol: "NSH", description: "CTCP Tập đoàn Nhôm Sông Hồng Shalumi common shares — daily adjusted close (giá điều chỉnh), full VND per share", contract_unit: "share", currency: "VND" }

weather_regions:
  - { region_code: "GLOBAL_NA", name: "Not a price driver — listed equity; weather has no direct price channel", country: "" }

production_regions:
  - { region_code: "VN", name: "Vietnam (the issuer's core operations are domestic)", role: "production" }

consumption_regions:
  - { region_code: "VN", name: "Vietnam domestic demand for the issuer's products/services", role: "consumption" }

export_regions:
  - { region_code: "GLOBAL", name: "Not an export good — the share trades on HNX; foreign portfolio flows are the cross-border channel", role: "export" }

import_regions:
  - { region_code: "GLOBAL", name: "Foreign portfolio investors (ETF rebalancing, foreign room) buying via HNX", role: "import" }

physical_drivers:
  - { metric_code: "earnings_growth", description: "Profit cycle: aluminum-profile volumes and spreads over LME aluminum input" }
  - { metric_code: "sector_cycle", description: "Construction-materials cycle — housing construction demand and aluminum input prices" }

macro_drivers:
  - { metric_code: "vn_index", description: "VN-Index market beta — Vietnamese listed shares co-move with the broad index" }
  - { metric_code: "vn_policy_rate", description: "SBV policy/deposit rates — the discount rate for equities and credit conditions" }
  - { metric_code: "usd_vnd", description: "USD/VND — FX pressure drives foreign flows and SBV policy room" }

logistics_drivers:
  - { metric_code: "market_liquidity", description: "Exchange turnover and margin-lending balances — the liquidity regime" }
  - { metric_code: "foreign_flows", description: "Foreign net buy/sell in the ticker (foreign room, ETF rebalancing, index reviews)" }

event_risk_drivers:
  - { metric_code: "regulatory_policy", description: "Sector regulation, licensing and trade/tax policy affecting the issuer" }
  - { metric_code: "corporate_events", description: "Dividends / splits / rights issues, M&A and index-review changes" }
  - { metric_code: "global_risk", description: "Global risk-off episodes, EM outflows and US rates spilling into Vietnamese equities" }

data_sources:
  - { source_code: "ENTRADE", name: "DNSE Entrade public chart API (daily adjusted OHLC bars)", access: "public", url: "https://services.entrade.com.vn/chart-api/v2/ohlcs/stock" }
  - { source_code: "HNX", name: "Hanoi Stock Exchange (listing reference)", access: "public", url: "https://www.hnx.vn" }

models:
  - { model_code: "naive_rw", family: "baseline", horizon: "daily", description: "Random-walk baseline (best-of pool)" }
  - { model_code: "ridge_ar", family: "scikit-learn", horizon: "daily", description: "Ridge autoregression on lagged close" }
  - { model_code: "xgb_gbm", family: "xgboost", horizon: "daily", description: "Gradient boosting on lagged/exogenous features" }

notes: "Vietnamese listed equity — CTCP Tập đoàn Nhôm Sông Hồng Shalumi (HNX: NSH), an aluminum-profile maker listed on HNX (small-cap — expect thinner liquidity) (NOT a VN30 constituent). Daily ADJUSTED close from a public chart API (quotes published in thousands of VND, rescaled ×1000 to full VND at ingest; corporate actions already adjusted — see the vn_stocks restatement caveat in configs/ingestion/sources.yaml). Forecasts are statistical analytics over price history — not investment advice (không phải lời khuyên đầu tư)."
